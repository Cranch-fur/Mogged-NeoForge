pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
	}
}

plugins {
	// Lets the Java toolchain in build.gradle download a matching JDK
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mogged-neoforge'
